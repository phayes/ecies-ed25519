[package]
name = "ecies-ed25519"
version = "0.6.0"
authors = ["phayes <patrick.d.hayes@gmail.com>"]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "ECIES on Twisted Edwards Curve25519 using AES-GCM and HKDF-SHA256"
categories = ["cryptography", "no-std"]
keywords = ["ecies", "encryption", "ed25519", "curve25519", "aes-gcm"]
repository = "https://github.com/phayes/ecies-ed25519"
readme = "README.md"

[dependencies]
rand_core = "0.10.1"
curve25519-dalek = { version = "5.0.0", features = ["legacy_compatibility"] }
thiserror = { version = "2.0.18", default-features = false }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
zeroize = "1.9.0"
aes-gcm = { version = "0.11.0", default-features = false, features = ["aes", "alloc"] }
sha2 = "0.11.0"
hkdf = "0.13.0"
# "serde" feature
serde = { version = "1.0.228", optional = true, default-features = false, features = ["alloc"] }

[features]
default = ["std"]
std = ["hex/std", "serde?/std", "thiserror/std"]

[dev-dependencies]
rand = "0.10.2"
serde_json = "1.0.150"
postcard = { version = "1.1.3", features = ["alloc"] }
